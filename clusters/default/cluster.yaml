kind: Cluster
name: talos-default
kubernetes:
  version: v1.35.3
  manifests:
  - name: test
    mode: one-time
    inline:
    - apiVersion: v1
      kind: Pod
      metadata:
        name: nginx
        namespace: default
      spec:
        containers:
        - name: nginx
          image: nginx:1.14.2
          ports:
          - containerPort: 80
talos:
  version: v1.12.6
---
kind: ControlPlane
machines:
  - 1c1a407c-b8b0-4b57-8a33-85e743e26c61
patches:
  - idOverride: 400-talos-default-control-planes-untaint
    inline:
      cluster:
        allowSchedulingOnControlPlanes: true
---
kind: Workers
---
kind: Machine
name: 1c1a407c-b8b0-4b57-8a33-85e743e26c61
patches:
  - idOverride: 400-cm-1c1a407c-b8b0-4b57-8a33-85e743e26c61
    inline:
      apiVersion: v1alpha1
      auto: "off"
      hostname: beta1
      kind: HostnameConfig
