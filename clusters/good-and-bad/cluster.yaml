kind: Cluster
name: Good-and-Bad
kubernetes:
  version: v1.35.1
talos:
  version: v1.12.1
patches:
  - name: allow-cp
    file: patches/allow-cp.yaml
---
kind: ControlPlane
machineClass:
  name: libvirt-medium
  size: 1
systemExtensions:
  - siderolabs/qemu-guest-agent
---
kind: Workers
name: Good
machineClass:
  name: libvirt-small
  size: 1
systemExtensions:
  - siderolabs/qemu-guest-agent
---
kind: Workers
name: Bad
machineClass:
  name: libvirt-small
  size: 1
systemExtensions:
  - siderolabs/qemu-guest-agent
